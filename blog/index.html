<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - zhudefa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --text-main: #111827;
            --text-secondary: #4b5563;
            --text-muted: #6b7280;
            --bg-body: #ffffff;
            --bg-sidebar: #f9fafb;
            --border-color: #e5e7eb;
            --hover-bg: #f3f4f6;
            --tag-bg: #eff6ff;
            --tag-text: #1d4ed8;
            --snake-head: rgba(37, 99, 235, 0.9);
            --snake-body: rgba(96, 165, 250, 0.7);
            --snake-food: rgba(16, 185, 129, 0.8);
        }
        [data-theme="dark"] {
            --primary-color: #60a5fa;
            --text-main: #f9fafb;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --bg-body: #0f172a; 
            --bg-sidebar: #1e293b;
            --border-color: #334155;
            --hover-bg: #334155;
            --tag-bg: #1e3a8a;
            --tag-text: #bfdbfe;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-main);
            background-color: var(--bg-body);
            overflow-x: hidden;
        }
        .layout-wrapper {
            display: flex;
            min-height: 100vh;
            max-width: 1280px;
            margin: 0 auto;
        }
        .sidebar {
            width: 300px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }
        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }
        .name-block h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .name-block h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-bottom: 15px;
        }
        .position-badge {
            display: inline-block;
            background: var(--tag-bg);
            color: var(--tag-text);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 25px;
        }
        .contact-list {
            list-style: none;
            font-size: 0.9rem;
        }
        .contact-list li {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-secondary);
        }
        .contact-list a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        .contact-list a:hover {
            color: var(--primary-color);
        }
        .contact-list i {
            width: 16px;
            text-align: center;
            color: var(--text-muted);
        }
        .sidebar-nav {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .sidebar-nav .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }
        .sidebar-nav .nav-link:hover {
            background: var(--hover-bg);
            color: var(--primary-color);
        }
        .sidebar-nav .nav-link i {
            width: 16px;
            text-align: center;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .sidebar-nav .nav-link:hover i {
            color: var(--primary-color);
        }
        .main-content {
            flex: 1;
            padding: 60px 80px;
            max-width: 900px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            letter-spacing: -0.02em;
        }
        /* blog-specific */
        .post-list { display: flex; flex-direction: column; gap: 1.2rem; }
        .post-card { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 10px; padding: 1.5rem; transition: border-color 0.2s, transform 0.2s; text-decoration: none; color: inherit; display: block; }
        .post-card:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .post-date { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
        .post-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.5rem; color: var(--primary-color); }
        .post-excerpt { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.5; }
        .post-tags { margin-top: 0.8rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .post-tags .tag { background: var(--tag-bg); color: var(--tag-text); padding: 0.15rem 0.6rem; border-radius: 20px; font-size: 0.8rem; }
        .sidebar-footer { margin-top: auto; padding-top: 30px; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-muted); }
        .visit-count { display: flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.75rem; cursor: pointer; user-select: none; transition: color 0.2s; }
        .visit-count:hover { color: var(--primary-color); }
        .visit-count.masked #busuanzi_container_site_pv { display: none !important; }
        .visit-count:not(.masked) .visit-placeholder { display: none; }
        .controls { display: flex; gap: 15px; margin-top: 15px; }
        .control-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: color 0.2s; padding: 5px; }
        .control-btn:hover { color: var(--primary-color); }
        @media (max-width: 600px) { .main-content { padding: 40px 20px; } }
    </style>
</head>
<body>
<div class="layout-wrapper">
    <aside class="sidebar">
        <img src="/images/profile.jpeg" alt="Profile" class="profile-img">
        <div class="name-block">
            <h1>Defa Zhu (朱德发)</h1>
            <h2>AI Researcher</h2>
        </div>
        <span class="position-badge">ByteDance</span>
        <ul class="contact-list">
            <li><i class="fas fa-envelope"></i><a href="mailto:example@example.com">example@example.com</a></li>
            <li><i class="fab fa-github"></i><a href="https://github.com/zhudefa" target="_blank">zhudefa</a></li>
        </ul>
        <nav class="sidebar-nav">
            <a href="/" class="nav-link"><i class="fas fa-home"></i>Home</a>
            <a href="/blog/" class="nav-link active"><i class="fas fa-pen-nib"></i>Blog</a>
        </nav>
        <div class="sidebar-footer">
            <div>
                <p>&copy; 2025 Defa Zhu</p>
                <div class="visit-count masked" id="visit-toggle" title="Click to show/hide views">
                    <i class="fas fa-eye"></i>
                    <span class="visit-placeholder">Show Views</span>
                    <span id="busuanzi_container_site_pv"> <span id="busuanzi_value_site_pv">--</span> views</span>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" id="theme-toggle" title="Toggle Theme"><i class="fas fa-moon"></i></button>
                <button class="control-btn" id="animation-toggle" title="Toggle Animation"><i class="fas fa-magic"></i></button>
            </div>
        </div>
    </aside>
    <main class="main-content">
        <section id="blog">
            <h2 class="section-title">Blog</h2>
            <div class="post-list">
                <a class="post-card" href="posts/c_and_si.html">
                    <div class="post-date">2026-02-27</div>
                    <div class="post-title">Carbon and Silicon, Man and God</div>
                    <div class="post-excerpt">A final prophecy and reflection on the transition from carbon-based to silicon-based life.</div>
                    <div class="post-tags"><span class="tag">Philosophy</span><span class="tag">Future</span></div>
                </a>
            </div>
        </section>
    </main>
</div>
<script>
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle');
    const visitToggle = document.getElementById('visit-toggle');
    
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            const newTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            htmlEl.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon();
        });
    }
    
    function updateThemeIcon() {
        const isDark = htmlEl.getAttribute('data-theme') === 'dark';
        if (themeBtn) {
            themeBtn.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        }
    }
    
    if (visitToggle) {
        visitToggle.addEventListener('click', () => {
            visitToggle.classList.toggle('masked');
        });
    }
    
    document.addEventListener('DOMContentLoaded', () => {
        htmlEl.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
        updateThemeIcon();
    });
</script>
</body>
</html>
